img_root: "D:/your_project_path"
camera_names:
  - Basler 60gc
  - Basler 60gm
  - Hikrobot

reference_camera_index: 0 # Color camera is a better reference for meshing (to get the texture right)

checkerboard:
  board_size: [16, 11] # Number of inner corners per chessboard row and column (width, height)
  square_size: 7
  unit: "mm"

# The folder names and file name patterns used in the project.
# First three are input folders, last four are output folders.
folders:
  intrinsic_images: "chessboards/intrinsics_img_sets"
  extrinsic_images: "chessboards/extrinsics_img_sets"
  objects: "object"
  calibration_files: "calibration_files"
  reconstruction_results: "reconstruction_results"

filenames:
  calibration_result_ending: "_calibration.json"
  extrinsics_result: "extrinsics_result.json"

# Optional correction when camera capture counters are cyclically offset.
# Verify offsets from calibration geometry; do not copy dataset-specific values.
# stereo_sync:
#   frame_cycle_length: 15
#   frame_key_offsets:
#     Basler 60gc: 0
#     Basler 60gm: 9
#     Hikrobot: 9

# Optional reproducible one-frame sparse reconstruction baseline.
# sparse_baseline:
#   object_name: terminal_green
#   frame_key: "1"
#   target_camera_indices: [1]
#   feature_method: sift
#   lowe_ratio: 0.75
#   max_reprojection_error_px: 2.0
#   output_folder: reconstruction_results_baseline

visual_hull:
  # The borders in the reference camera's coordinate system.
  # The unit is the same as the chessboard square size
  bounds_min_xyz: [-100.0, -100.0, 300.0]
  bounds_max_xyz: [100.0, 100.0, 500.0]

  voxel_size: 1.0

  threshold: 25
  morph_kernel_size: 5
  mask_dilation_px: 3
  keep_largest_component: true

  # null = voxel is accepted only if it is inside the object mask in all cameras.
  min_camera_support: null

  save_debug_masks: true
  save_occupied_voxels: true
  save_surface_voxels: true

# Debug: use only certain cameras and frames to find issues 
# in reconstructions results. Null uses all cameras/frames.
debug:
  enabled: false
  target_camera_indices: [2]   # null, [1], [2]
  frame_keys_to_use: null     # null, ["1"], ["1", "2"], ["4"], ...
